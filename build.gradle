buildscript {
    repositories {
        maven {
            url 'https://dl.bintray.com/giancosta86/Hephaestus'
        }

        jcenter()
    }

    dependencies {
        classpath 'info.gianlucacosta.moonlicense:moonlicense-gradle:5.0'
        classpath 'info.gianlucacosta.aurora:aurora:9.2'
    }
}



apply plugin: 'scala'
apply plugin: 'maven'
apply plugin: 'application'

apply plugin: 'info.gianlucacosta.moonlicense'
apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.asgard'
archivesBaseName = 'valkyrie'
version '1.0'

description = 'Data mining for Farbiges Deutsch'


sourceCompatibility = 1.8


mainClassName = 'info.gianlucacosta.valkyrie.App'


repositories {
    mavenCentral()
}


dependencies {
    generatedCompile 'org.scala-lang:scala-library:2.12.3'

    compile 'org.scala-lang:scala-library:2.12.3'

    compile 'info.gianlucacosta.asgard:odin:1.0'
}



moonLicense {
    license = apache2

    productInfo {
        productName = 'Valkyrie'
        inceptionYear = 2017
        copyrightHolder = 'Gianluca Costa'
    }
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }

    commandLineApp = true
}
